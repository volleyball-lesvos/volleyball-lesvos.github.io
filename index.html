<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Πρωταθλήματα Βόλεϊ - Τοπική Επιτροπή</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #1b365d;
            text-align: center;
        }
        .matchday-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            padding: 20px;
        }
        .matchday-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d9534f;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .match-row:last-child {
            border-bottom: none;
        }
        .team {
            display: flex;
            align-items: center;
            width: 40%;
        }
        .team.home {
            justify-content: flex-end;
            text-align: right;
        }
        .team.away {
            justify-content: flex-start;
            text-align: left;
        }
        .team-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 10px;
        }
        .match-score {
            font-weight: bold;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        /* Στυλ Λογότυπων */
        .team-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ddd;
            padding: 2px;
        }
        .team-logo-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1b365d;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Πρωτάθλημα Πετοσφαίρισης</h1>
    <h2>Πρόγραμμα & Αγώνες με Λογότυπα Ομάδων</h2>

    <!-- 1η Αγωνιστική (Ανδρών) -->
    <div class="matchday-card">
        <div class="matchday-title">1η Αγωνιστική</div>
        
        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΑΣ Μαραθοκάμπου</span>
                <div class="team-logo-placeholder">ΑΣ</div>
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <img src="ΠΟΛΥΚΡΑΤΗΣ LOGO.jpg" alt="ΑΟ Πολυκράτης" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΑΟ</div>'">
                <span class="team-name">ΑΟ Πολυκράτης</span>
            </div>
        </div>

        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΑΣ Άθληση</span>
                <div class="team-logo-placeholder">ΑΣ</div>
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <img src="ΦΟΚ LOGO.jpg" alt="ΦΟΚ" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΦΟ</div>'">
                <span class="team-name">ΦΟΚ</span>
            </div>
        </div>
    </div>
    
    <!-- 2η Αγωνιστική (Ανδρών) -->
    <div class="matchday-card">
        <div class="matchday-title">2η Αγωνιστική</div>
        
        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΑΟ Πολυκράτης</span>
                <img src="ΠΟΛΥΚΡΑΤΗΣ LOGO.jpg" alt="ΑΟ Πολυκράτης" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΑΟ</div>'">
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <div class="team-logo-placeholder">ΑΣ</div>
                <span class="team-name">ΑΣ Άθληση</span>
            </div>
        </div>

        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΦΟΚ</span>
                <img src="ΦΟΚ LOGO.jpg" alt="ΦΟΚ" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΦΟ</div>'">
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <img src="ΑΘΛΕΩΝ LOGO.jpg" alt="ΑΕΣΣ Αθλέων" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΑΕ</div>'">
                <span class="team-name">ΑΕΣΣ Αθλέων</span>
            </div>
        </div>
    </div>
    
    <!-- 1η Αγωνιστική Γυναικών (Πρόταση) -->
    <div class="matchday-card">
        <div class="matchday-title">1η Αγωνιστική Γυναικών (Πρόταση)</div>
        
        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΦΟΚ</span>
                <img src="ΦΟΚ LOGO.jpg" alt="ΦΟΚ" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΦΟ</div>'">
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <div class="team-logo-placeholder">ΑΕ</div>
                <span class="team-name">ΑΕΤΟΣ Λήμνου</span>
            </div>
        </div>

        <div class="match-row">
            <div class="team home">
                <span class="team-name">ΝΗΡΕΑΣ</span>
                <img src="ΝΗΡΕΑΣ LOGO.jpeg" alt="ΝΗΡΕΑΣ" class="team-logo" onerror="this.outerHTML='<div class=\'team-logo-placeholder\'>ΝΗ</div>'">
            </div>
            <div class="match-score">-</div>
            <div class="team away">
                <div class="team-logo-placeholder">ΗΦ</div>
                <span class="team-name">ΗΦΑΙΣΤΟΣ Λήμνου</span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
