<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Τοπική Επιτροπή Βόλεϊ Ν. Λέσβου – Πρωταθλήματα 2026–27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F9; --surface:#FFFFFF; --ink:#102A3C; --muted:#5A6F81; --line:#D5E0E9;
  --sea:#0B57A4; --sea-deep:#0A3D7A; --on-sea:#FFFFFF; --ball:#F5C518; --ball-ink:#2B2200;
  --row:#F7FAFC;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141E; --surface:#0F2333; --ink:#E6EEF4; --muted:#91A7B8; --line:#1E3A50;
    --sea:#7CC0EC; --sea-deep:#0A3D7A; --on-sea:#FFFFFF; --row:#132B3E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08141E; --surface:#0F2333; --ink:#E6EEF4; --muted:#91A7B8; --line:#1E3A50;
  --sea:#7CC0EC; --sea-deep:#0A3D7A; --on-sea:#FFFFFF; --row:#132B3E;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

.masthead{background:var(--sea-deep);color:var(--on-sea);border-bottom:6px solid var(--ball)}
.masthead .wrap{padding:28px 20px 22px;display:flex;gap:16px;align-items:center}
.mark{flex:none;width:72px;height:72px;border-radius:50%}
.scope{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:24px 0 0}
.scope .cat{font-size:clamp(1.7rem,5.5vw,2.4rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.scope .ph{font-size:clamp(1.05rem,3vw,1.3rem);font-weight:600;color:var(--sea)}
.logo{position:relative;flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;overflow:hidden;border:1px solid var(--line);vertical-align:middle}
.logo b{font-size:.6rem;font-weight:800;color:#0A3D7A}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl{display:inline-flex;align-items:center;gap:10px;min-width:0}
.tl span:last-child{overflow:hidden;text-overflow:ellipsis}
.masthead h1{margin:0;font-size:clamp(1.5rem,4.5vw,2.25rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.masthead p{margin:2px 0 0;opacity:.8;font-size:.95rem}
.wrap{max-width:960px;margin:0 auto}

.picker{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.picker .wrap{padding:12px 20px 10px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.row.phases{margin-top:8px}
.row.phases .chip{padding:5px 12px;font-size:.9rem;font-weight:500}

main .wrap{padding:8px 20px 40px}
h2{font-size:1.35rem;font-weight:800;margin:32px 0 12px;letter-spacing:-.01em}

.table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:980px;font-variant-numeric:tabular-nums}
th{white-space:normal!important;line-height:1.2;vertical-align:bottom}
th.grp,td.grp{border-left:1px solid var(--line)}
td.team,th.team{position:sticky;left:0;background:var(--surface);z-index:1}
td.sec{font-weight:700}
@media (max-width:600px){th,td{padding:8px 5px}th{font-size:.72rem}td.pos{width:30px}}
th,td{padding:10px 10px;text-align:center;white-space:nowrap}
th{font-size:.8rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.pos{font-weight:800;font-size:1.15rem;width:44px;color:var(--sea)}
td.team,th.team{text-align:left;font-weight:700}
td.pts{font-weight:800;font-size:1.1rem}
td.pts span{display:inline-block;min-width:2.2em;padding:2px 8px;border-radius:6px;background:var(--ball);color:var(--ball-ink)}
td.dim{color:var(--muted)}
.legend{font-size:.85rem;color:var(--muted);margin:8px 2px 0}

.round{margin-top:24px}
.round h3{display:flex;align-items:baseline;gap:10px;font-size:1.05rem;margin:0 0 10px;font-weight:700}
.tag{font-size:.75rem;font-weight:700;background:var(--ball);color:var(--ball-ink);padding:2px 8px;border-radius:999px}
.matches{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.meta time{font-weight:600;color:var(--ink)}
.box{display:grid;grid-template-columns:1fr auto repeat(5,2.1em);align-items:center;row-gap:4px;font-variant-numeric:tabular-nums}
.box .name{font-weight:500;white-space:nowrap;padding-right:8px;min-width:0;display:flex}
.box .name.w{font-weight:800}
.box .tot{width:1.9em;height:1.9em;display:grid;place-items:center;border-radius:6px;font-weight:800;border:1px solid var(--line);margin-right:6px}
.box .tot.w{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.box .s{text-align:center;color:var(--muted);font-size:.92rem}
.box .s.w{color:var(--ink);font-weight:700}
.box .pending{grid-column:2 / -1;color:var(--muted);font-size:.9rem;text-align:right}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
footer .wrap{padding:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
footer a{color:var(--sea)}
.back{display:inline-block;margin-top:20px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.back:hover{border-color:var(--sea)}

/* Γραφικά για social */
#studio .wrap{padding:8px 20px 40px}
.studio{display:grid;gap:24px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.studio{grid-template-columns:1fr}}
.controls{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.controls label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.controls select,.controls input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:1rem}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--sea);color:var(--bg)}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.preview canvas{width:100%;max-width:440px;height:auto;display:block;border-radius:10px;box-shadow:0 2px 0 var(--line)}
.preview textarea{width:100%;max-width:440px;min-height:180px;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin:0}
.status{font-size:.85rem;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,color .15s}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <img class="mark" id="mark" alt="Λογότυπο Τοπικής Επιτροπής">
    <div>
      <h1 id="siteTitle">Τοπική Επιτροπή Βόλεϊ Ν. Λέσβου</h1>
      <p id="siteSub">Πρωταθλήματα 2026–27</p>
    </div>
  </div>
</header>

<div id="publicView">
  <nav class="picker" aria-label="Κατηγορία και φάση">
    <div class="wrap">
      <div class="row" id="cats" role="group" aria-label="Κατηγορία"></div>
      <div class="row phases" id="phases" role="group" aria-label="Φάση"></div>
    </div>
  </nav>
  <main>
    <div class="wrap" id="content"><p class="status">Φόρτωση αποτελεσμάτων…</p></div>
  </main>
</div>

<section id="studio" hidden>
  <div class="wrap">
    <a class="back" href="#/">Πίσω στα αποτελέσματα</a>
    <h2>Εικόνες για Facebook και Instagram</h2>
    <div class="studio">
      <div class="controls">
        <label>Τι θέλεις να δείξεις
          <select id="gKind">
            <option value="results">Αποτελέσματα αγωνιστικής</option>
            <option value="fixtures">Πρόγραμμα αγωνιστικής</option>
            <option value="standings">Βαθμολογία</option>
          </select>
        </label>
        <label>Κατηγορία <select id="gCat"></select></label>
        <label>Φάση <select id="gPhase"></select></label>
        <label id="gRoundWrap">Αγωνιστική <select id="gRound"></select></label>
        <label>Μέγεθος
          <select id="gFormat">
            <option value="post">Ανάρτηση (1080×1350)</option>
            <option value="story">Story (1080×1920)</option>
          </select>
        </label>
        <button class="btn" id="gDownload" type="button">Κατέβασε την εικόνα</button>
        <button class="btn alt" id="gCopy" type="button">Αντέγραψε τη λεζάντα</button>
        <p class="note">Η εικόνα και η λεζάντα φτιάχνονται από τα ίδια δεδομένα με το site. Ανέβασέ τες από το Meta Business Suite για να βγουν μαζί σε Facebook και Instagram.</p>
      </div>
      <div class="preview">
        <canvas id="gCanvas" width="1080" height="1350" aria-label="Προεπισκόπηση εικόνας"></canvas>
        <textarea id="gCaption" aria-label="Λεζάντα" readonly></textarea>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span id="dataStatus"></span>
  </div>
</footer>

/* ============ ΔΕΔΟΜΕΝΑ ============ */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f="" }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
const num=v=>{const n=parseInt(String(v).replace(",","."),10);return Number.isFinite(n)?n:null};
function parseSet(s){
  const m=String(s||"").match(/(\d+)\s*[-–—:]\s*(\d+)/);
  return m?[+m[1],+m[2]]:null;
}
function parseDate(s){
  const m=String(s||"").match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  const d=+m[1],mo=+m[2];
  let y=m[3]?+m[3]:(mo>=8?CONFIG.SEASON_START_YEAR:CONFIG.SEASON_START_YEAR+1);
  if(y<100) y+=2000;
  return new Date(y,mo-1,d,m[4]?+m[4]:0,m[5]?+m[5]:0);
}
function toMatches(rows){
  return rows.map(r=>{
    const sets=["1ο ΣΕΤ","2ο ΣΕΤ","3ο ΣΕΤ","4ο ΣΕΤ","5ο ΣΕΤ"].map(k=>parseSet(r[k])).filter(Boolean);
    const hs=num(r["Σετ Γηπεδούχου"]), as=num(r["Σετ Φιλοξενούμενης"]);
    return {
      cat:r["Κατηγορία"], phase:r["Φάση"], round:num(r["Αγωνιστική"]),
      dateRaw:r["Ημερομηνία & Ώρα"], date:parseDate(r["Ημερομηνία & Ώρα"]),
      venue:r["Γήπεδο"], home:r["Γηπεδούχος"], away:r["Φιλοξενούμενη"],
      hs, as, sets, played: hs!==null && as!==null && (hs===3||as===3)
    };
  }).filter(m=>m.cat&&m.phase&&m.home&&m.away);
}
const uniq=a=>[...new Set(a)];

function standings(matches){
  const T={};
  const get=n=>T[n]||(T[n]={team:n,gp:0,w:0,l:0,nh:0,res:{"3-0":0,"3-1":0,"3-2":0,"2-3":0,"1-3":0,"0-3":0},pts:0,sf:0,sa:0,pf:0,pa:0});
  for(const m of matches){
    get(m.home);get(m.away);
    if(!m.played) continue;
    const ph=m.sets.reduce((a,s)=>a+s[0],0), pa=m.sets.reduce((a,s)=>a+s[1],0);
    [[m.home,m.hs,m.as,ph,pa],[m.away,m.as,m.hs,pa,ph]].forEach(([n,f,a,pf,pa2])=>{
      const t=get(n),k=`${f}-${a}`;
      t.gp++; f>a?(t.w++,t.nh+=2):(t.l++,t.nh+=1);
      if(k in t.res) t.res[k]++;
      t.pts+=CONFIG.POINTS[k]??0; t.sf+=f; t.sa+=a; t.pf+=pf; t.pa+=pa2;
    });
  }
  const ratio=(a,b)=>b===0?a:a/b;
  return Object.values(T).map(t=>({...t,sr:ratio(t.sf,t.sa),pr:ratio(t.pf,t.pa)}))
    .sort((a,b)=>b.nh-a.nh||b.pts-a.pts||b.sr-a.sr||b.pr-a.pr||a.team.localeCompare(b.team,"el"));
}
const fmtRatio=r=>r.toLocaleString("el-GR",{maximumFractionDigits:3});

/* ============ ΒΟΗΘΗΤΙΚΑ ============ */
const DAYS=["Κυρ","Δευ","Τρί","Τετ","Πέμ","Παρ","Σάβ"];
const pad2=n=>String(n).padStart(2,"0");
function fmtDate(m){
  if(!m.date) return m.dateRaw&&!/ΟΡΙΣ/i.test(m.dateRaw)?m.dateRaw:"Ημερομηνία προς ορισμό";
  const d=m.date;
  return `${DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}, ${d.getHours()}:${pad2(d.getMinutes())}`;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ordinal=n=>`${n}η αγωνιστική`;
const ordinalGen=n=>`${n}ης αγωνιστικής`;
const logoKey=n=>String(n||"").trim().replace(/\s+[ΑΒΓΔ]$/,"");
const logoSrc=n=>LOGOS[logoKey(n)]||(CONFIG.LOGO_DIR?CONFIG.LOGO_DIR+encodeURIComponent(logoKey(n))+".png":"");
const initials=n=>logoKey(n).slice(0,3);
function teamHTML(n){const src=logoSrc(n);
  return `<span class="tl"><span class="logo" aria-hidden="true"><b>${esc(initials(n))}</b>${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span><span>${esc(n)}</span></span>`}
const byDate=(a,b)=>(a.date?a.date.getTime():Infinity)-(b.date?b.date.getTime():Infinity);

/* ============ ΚΑΤΑΣΤΑΣΗ ============ */
let ALL=[], state={cat:null,phase:null};
const $=id=>document.getElementById(id);

function readHash(){
  const parts=decodeURIComponent(location.hash.replace(/^#\/?/,"")).split("/");
  if(parts[0]==="studio") return {studio:true};
  return {cat:parts[0]||null,phase:parts[1]||null};
}
function cats(){return uniq(ALL.map(m=>m.cat))}
function phases(cat){return uniq(ALL.filter(m=>m.cat===cat).map(m=>m.phase))}
function inScope(cat,phase){return ALL.filter(m=>m.cat===cat&&m.phase===phase)}

/* ============ ΔΗΜΟΣΙΑ ΣΕΛΙΔΑ ============ */

      <th class="grp">ΣΕΤ +</th><th>ΣΕΤ -</th><th>Ratio (Σετ)</th><th class="grp">Πόντοι +</th><th>Πόντοι -</th><th>Ratio (Πόντοι)</th></tr></thead>
    <tbody>${st.map((t,i)=>`<tr>
      <td class="pos">${i+1}</td><td class="team">${teamHTML(t.team)}</td><td>${t.gp}</td><td>${t.w}</td><td>${t.l}</td><td class="pts"><span>${t.nh}</span></td>
      ${["3-0","3-1","3-2","2-3","1-3","0-3"].map((k,j)=>`<td class="dim${j?"":" grp"}">${t.res[k]}</td>`).join("")}<td class="sec">${t.pts}</td>
      <td class="grp">${t.sf}</td><td>${t.sa}</td><td class="dim">${t.gp?fmtRatio(t.sr):"–"}</td>
      <td class="grp">${t.pf}</td><td>${t.pa}</td><td class="dim">${t.gp?fmtRatio(t.pr):"–"}</td></tr>`).join("")}</tbody>
  </table></div>
  <p class="legend">Κατάταξη με τους Βαθμούς (Ν-Η): 2 για νίκη, 1 για ήττα. Σε ισοβαθμία μετράνε οι Βαθμοί (Αποτ.) (3-0 και 3-1: 3, 3-2: 2, 2-3: 1, 1-3 και 0-3: 0), μετά το ratio σετ και μετά το ratio πόντων.</p>`;

  const rounds=uniq(ms.map(m=>m.round)).sort((a,b)=>(a??999)-(b??999));
  const next=rounds.find(r=>ms.some(m=>m.round===r&&!m.played));
  html+=`<h2>Αγωνιστικές</h2>`;
  for(const r of rounds){
    const list=ms.filter(m=>m.round===r).sort(byDate);
    html+=`<section class="round" id="r${r}"><h3>${r?ordinal(r):"Χωρίς αγωνιστική"}${r===next?' <span class="tag">Επόμενη</span>':""}</h3><div class="matches">${list.map(matchCard).join("")}</div></section>`;
  }
  $("content").innerHTML=html;
}
function matchCard(m){
  const meta=`<div class="meta"><time>${esc(fmtDate(m))}</time><span>${esc(m.venue)}</span></div>`;
  if(!m.played){
    return `<article class="match">${meta}<div class="box">
      <div class="name">${teamHTML(m.home)}</div><div class="pending">–</div>
      <div class="name">${teamHTML(m.away)}</div><div class="pending">–</div></div></article>`;
  }
  const hw=m.hs>m.as;
  const cells=(i)=>{let s="";for(let k=0;k<5;k++){const set=m.sets[k];
      if(!set){s+=`<div class="s"></div>`;continue}
      const mine=set[i],other=set[1-i];s+=`<div class="s${mine>other?" w":""}">${mine}</div>`}return s};
  return `<article class="match">${meta}<div class="box">
    <div class="name${hw?" w":""}">${teamHTML(m.home)}</div><div class="tot${hw?" w":""}">${m.hs}</div>${cells(0)}
    <div class="name${!hw?" w":""}">${teamHTML(m.away)}</div><div class="tot${!hw?" w":""}">${m.as}</div>${cells(1)}
  </div></article>`;
}

const G={bg:"#0A3D7A",panel:"rgba(255,255,255,.07)",white:"#FFFFFF",soft:"rgba(255,255,255,.72)",faint:"rgba(255,255,255,.45)",ball:"#F5C518",ballInk:"#2B2200"};
const FONT='"Commissioner", system-ui, sans-serif';
function fillOptions(sel,vals,label=v=>v){
  const cur=sel.value;
  sel.innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join("");
  if(vals.map(String).includes(cur)) sel.value=cur;
}
function renderStudio(){
  fillOptions($("gCat"),cats());
  fillOptions($("gPhase"),phases($("gCat").value));
  const ms=inScope($("gCat").value,$("gPhase").value);
  const kind=$("gKind").value;
  const rounds=uniq(ms.map(m=>m.round)).filter(r=>r!=null).sort((a,b)=>a-b);
  const prev=$("gRound").value;
  fillOptions($("gRound"),rounds.map(String),r=>ordinal(r));
  if(!rounds.map(String).includes(prev)){
    // προεπιλογή: τελευταία παιγμένη για αποτελέσματα, επόμενη για πρόγραμμα
    const played=rounds.filter(r=>ms.some(m=>m.round===r&&m.played));
    const pending=rounds.filter(r=>ms.some(m=>m.round===r&&!m.played));
    const pick=kind==="fixtures"?pending[0]:played[played.length-1];
    if(pick!=null) $("gRound").value=String(pick);
  }
  $("gRoundWrap").hidden=kind==="standings";
  draw();
}
function fitText(ctx,text,maxW,size,weight){
  let s=size;ctx.font=`${weight} ${s}px ${FONT}`;
  while(ctx.measureText(text).width>maxW&&s>18){s-=2;ctx.font=`${weight} ${s}px ${FONT}`}
  return s;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

const IMG=new Map();
function loadImg(src){
  if(!src) return Promise.resolve(null);
  if(!IMG.has(src)) IMG.set(src,new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src}));
  return IMG.get(src);
}
let LOGO_CACHE={};
function drawLogo(ctx,name,cx,cy,r){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle="#FFFFFF";ctx.fill();ctx.clip();
  const img=LOGO_CACHE[name];
  if(img) ctx.drawImage(img,cx-r,cy-r,2*r,2*r);
  else{ctx.fillStyle=G.bg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`800 ${Math.round(r*.7)}px ${FONT}`;ctx.fillText(initials(name),cx,cy+1)}
  ctx.restore();
}
async function draw(){
  try{await document.fonts.load(`800 40px Commissioner`);await document.fonts.load(`500 40px Commissioner`)}catch(e){}
  const cv=$("gCanvas"),ctx=cv.getContext("2d");
  const W=1080,H=$("gFormat").value==="story"?1920:1350;
  cv.width=W;cv.height=H;
  const kind=$("gKind").value,cat=$("gCat").value,phase=$("gPhase").value,round=num($("gRound").value);
  const ms=inScope(cat,phase);
  const teams=uniq(ms.flatMap(m=>[m.home,m.away]));
  const imgs=await Promise.all(teams.map(t=>loadImg(logoSrc(t))));
  LOGO_CACHE=Object.fromEntries(teams.map((t,i)=>[t,imgs[i]]));
  const emblem=await loadImg(COMMITTEE_LOGO);
  const P=72;
  ctx.fillStyle=G.bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=G.ball;ctx.fillRect(0,0,W,14);
  const ES=150;
  if(emblem) ctx.drawImage(emblem,W-P-ES,P-6,ES,ES);

  let y=P+20;
  ctx.textBaseline="top";ctx.textAlign="left";
  const headW=W-2*P-ES-24;
  fitText(ctx,CONFIG.COMMITTEE,headW,30,600);ctx.fillStyle=G.soft;ctx.fillText(CONFIG.COMMITTEE,P,y);
  y+=60;
  // ΚΑΤΗΓΟΡΙΑ και δίπλα η ΦΑΣΗ
  ctx.textBaseline="alphabetic";
  let cs=76;ctx.font=`800 ${cs}px ${FONT}`;
  const phW=()=>{ctx.font=`600 ${Math.round(cs*.5)}px ${FONT}`;const w2=ctx.measureText(phase).width;ctx.font=`800 ${cs}px ${FONT}`;return w2};
  while(ctx.measureText(cat).width+24+phW()>headW&&cs>44){cs-=2;ctx.font=`800 ${cs}px ${FONT}`}
  const sameLine=ctx.measureText(cat).width+24+phW()<=headW;
  const base=y+cs*.82;
  ctx.font=`800 ${cs}px ${FONT}`;ctx.fillStyle=G.ball;ctx.fillText(cat,P,base);
  const cw=ctx.measureText(cat).width;
  ctx.font=`600 ${Math.round(cs*.5)}px ${FONT}`;ctx.fillStyle=G.white;
  if(sameLine) ctx.fillText(phase,P+cw+24,base);
  else{y+=cs*.6;ctx.fillText(phase,P,base+cs*.6)}
  ctx.textBaseline="top";
  y+=cs+22;
  const title=kind==="standings"?"Βαθμολογία":kind==="results"?`Αποτελέσματα ${ordinalGen(round||"")}`:`Πρόγραμμα ${ordinalGen(round||"")}`;
  ctx.fillStyle=G.soft;fitText(ctx,title,W-2*P,38,600);ctx.fillText(title,P,y);
  y+=84;
  const bottom=H-130;

  if(kind==="standings") drawStandings(ctx,standings(ms),P,y,W-2*P,bottom-y);
  else drawMatches(ctx,ms.filter(m=>m.round===round).sort(byDate),kind,P,y,W-2*P,bottom-y);

  // footer
  ctx.fillStyle=G.ball;ctx.fillRect(P,H-96,64,6);
  ctx.fillStyle=G.soft;ctx.font=`600 28px ${FONT}`;ctx.textBaseline="top";ctx.textAlign="left";
  ctx.fillText(CONFIG.SITE_URL||`Πρωταθλήματα ${CONFIG.SEASON}`,P,H-74);
  $("gCaption").value=caption(kind,cat,phase,round,ms);
}
function drawMatches(ctx,list,kind,x,y,w,h){
  if(!list.length){ctx.fillStyle=G.soft;ctx.font=`500 34px ${FONT}`;ctx.fillText("Δεν υπάρχουν αγώνες σε αυτή την αγωνιστική.",x,y);return}
  const gap=24, ideal=kind==="results"?232:200;
  const bh=Math.min(ideal*1.4,(h-gap*(list.length-1))/list.length);
  const s=bh/ideal;
  const top=y+Math.max(0,(h-(bh*list.length+gap*(list.length-1)))/2)*.6;
  list.forEach((m,i)=>{
    const by=top+i*(bh+gap);
    ctx.fillStyle=G.panel;roundRect(ctx,x,by,w,bh,20*s);ctx.fill();
    const ix=x+32*s, iw=w-64*s;
    ctx.textBaseline="top";ctx.fillStyle=G.faint;ctx.font=`500 ${Math.round(26*s)}px ${FONT}`;
    ctx.fillText(`${fmtDate(m)}  |  ${m.venue}`,ix,by+24*s);
    const lineH=64*s, ly=by+70*s;
    if(kind==="results"&&m.played){
      const s2=Math.min(s,1.1), totW=72*s2, setW=56*s2, setsX=ix+iw-totW-20*s-setW*5;
      [[m.home,m.hs,0],[m.away,m.as,1]].forEach(([name,tot,idx],k)=>{
        const won=(idx===0?m.hs>m.as:m.as>m.hs), ty=ly+k*lineH;
        ctx.textAlign="left";ctx.textBaseline="middle";
        const lr=28*s;drawLogo(ctx,name,ix+lr,ty+lineH/2,lr);ctx.textAlign="left";ctx.textBaseline="middle";
        const nx=ix+2*lr+16*s;
        const fs=fitText(ctx,name,setsX-nx-20*s,Math.round(44*s),won?800:500);
        ctx.fillStyle=won?G.white:G.soft;ctx.font=`${won?800:500} ${fs}px ${FONT}`;ctx.fillText(name,nx,ty+lineH/2);
        ctx.textAlign="center";
        m.sets.forEach((set,j)=>{const mine=set[idx],oth=set[1-idx];
          ctx.fillStyle=mine>oth?G.white:G.faint;ctx.font=`${mine>oth?700:500} ${Math.round(32*s2)}px ${FONT}`;
          ctx.fillText(String(mine),setsX+setW*j+setW/2,ty+lineH/2)});
        const bx=ix+iw-totW,bs=56*s2;
        if(won){ctx.fillStyle=G.ball;roundRect(ctx,bx+(totW-bs)/2,ty+(lineH-bs)/2,bs,bs,10*s);ctx.fill();ctx.fillStyle=G.ballInk}
        else{ctx.strokeStyle=G.faint;ctx.lineWidth=2;roundRect(ctx,bx+(totW-bs)/2,ty+(lineH-bs)/2,bs,bs,10*s);ctx.stroke();ctx.fillStyle=G.soft}
        ctx.font=`800 ${Math.round(36*s2)}px ${FONT}`;ctx.fillText(String(tot),bx+totW/2,ty+lineH/2+1);
      });
    }else{
      [m.home,m.away].forEach((name,k)=>{
        ctx.textAlign="left";ctx.textBaseline="middle";
        const lr=28*s,cy=ly+k*lineH+lineH/2;drawLogo(ctx,name,ix+lr,cy,lr);ctx.textAlign="left";ctx.textBaseline="middle";
        const nx=ix+2*lr+16*s;
        const fs=fitText(ctx,name,iw-(nx-ix),Math.round(44*s),700);
        ctx.fillStyle=G.white;ctx.font=`700 ${fs}px ${FONT}`;ctx.fillText(name,nx,cy);
      });
      if(kind==="results"){ctx.textAlign="right";ctx.fillStyle=G.faint;ctx.font=`500 ${Math.round(28*s)}px ${FONT}`;ctx.fillText("Δεν έχει διεξαχθεί",ix+iw,ly+lineH)}
    }
    ctx.textAlign="left";
  });
}
function drawStandings(ctx,st,x,y,w,h){
  const cols=[{t:"#",x:0,a:"left"},{t:"Ομάδα",x:70,a:"left"},{t:"Αγ.",x:w-480,a:"center"},{t:"Ν",x:w-400,a:"center"},{t:"Η",x:w-320,a:"center"},{t:"Σετ",x:w-190,a:"center"},{t:"Βαθ.",x:w-50,a:"center"}];
  const rh=Math.min(104,h/(st.length+1));
  ctx.textBaseline="middle";ctx.fillStyle=G.faint;ctx.font=`600 26px ${FONT}`;
  cols.forEach(c=>{ctx.textAlign=c.a;ctx.fillText(c.t,x+c.x,y+rh/2)});
  st.forEach((t,i)=>{
    const ry=y+rh*(i+1);
    if(i%2===0){ctx.fillStyle=G.panel;roundRect(ctx,x-20,ry,w+40,rh,14);ctx.fill()}
    const cy=ry+rh/2,fs=Math.min(40,rh*.42);
    ctx.textAlign="left";ctx.fillStyle=G.ball;ctx.font=`800 ${fs}px ${FONT}`;ctx.fillText(String(i+1),x,cy);
    const lr=Math.min(28,rh*.32);drawLogo(ctx,t.team,x+70+lr,cy,lr);ctx.textAlign="left";ctx.textBaseline="middle";
    const nx=70+2*lr+16;
    const nfs=fitText(ctx,t.team,cols[2].x-nx-40,fs,700);ctx.fillStyle=G.white;ctx.font=`700 ${nfs}px ${FONT}`;ctx.fillText(t.team,x+nx,cy);
    ctx.textAlign="center";ctx.font=`500 ${fs*.85}px ${FONT}`;ctx.fillStyle=G.soft;
    ctx.fillText(String(t.gp),x+cols[2].x,cy);ctx.fillText(String(t.w),x+cols[3].x,cy);ctx.fillText(String(t.l),x+cols[4].x,cy);ctx.fillText(`${t.sf}-${t.sa}`,x+cols[5].x,cy);
    const bs=rh*.62;ctx.fillStyle=G.ball;roundRect(ctx,x+cols[6].x-bs*.7,cy-bs/2,bs*1.4,bs,10);ctx.fill();
    ctx.fillStyle=G.ballInk;ctx.font=`800 ${fs}px ${FONT}`;ctx.fillText(String(t.nh),x+cols[6].x,cy+1);
  });
}
function caption(kind,cat,phase,round,ms){
  const link=CONFIG.SITE_URL?`\n\nΌλα τα αποτελέσματα και η βαθμολογία: ${CONFIG.SITE_URL}`:"";
  if(kind==="standings"){
    const st=standings(ms);
    return `🏐 ${cat}, ${phase}: η βαθμολογία\n\n`+st.map((t,i)=>`${i+1}. ${t.team} ${t.nh} β. (νίκες-ήττες ${t.w}-${t.l})`).join("\n")+link+`\n\n${CONFIG.HASHTAGS}`;
  }
  const list=ms.filter(m=>m.round===round).sort(byDate);
  if(kind==="results"){
    return `🏐 ${cat}, ${phase}: αποτελέσματα ${ordinal(round)}\n\n`+list.map(m=>m.played
      ?`${m.home} – ${m.away} ${m.hs}-${m.as} (${m.sets.map(s=>s.join("-")).join(", ")})`
      :`${m.home} – ${m.away}: δεν έχει διεξαχθεί`).join("\n")+link+`\n\n${CONFIG.HASHTAGS}`;
  }
  return `🏐 ${cat}, ${phase}: πρόγραμμα ${ordinal(round)}\n\n`+list.map(m=>`${fmtDate(m)}\n${m.home} – ${m.away}\n📍 ${m.venue}`).join("\n\n")+link+`\n\n${CONFIG.HASHTAGS}`;
}
["gKind","gCat","gPhase","gRound","gFormat"].forEach(id=>$(id).addEventListener("change",()=>{
  if(id==="gCat"||id==="gKind") $("gRound").value="";
  renderStudio();
}));
$("gDownload").addEventListener("click",()=>{
  const cv=$("gCanvas");
  const name=[$("gCat").value,$("gPhase").value,$("gKind").value==="standings"?"βαθμολογία":ordinal($("gRound").value),$("gFormat").value].join("_").replace(/\s+/g,"-");
  cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},"image/png");
});
$("gCopy").addEventListener("click",async()=>{
  const t=$("gCaption");
  try{await navigator.clipboard.writeText(t.value);$("gCopy").textContent="Η λεζάντα αντιγράφηκε"}
  catch(e){t.select();$("gCopy").textContent="Πάτα Ctrl+C για αντιγραφή"}
  setTimeout(()=>$("gCopy").textContent="Αντέγραψε τη λεζάντα",2500);
});

/* ============ ΕΚΚΙΝΗΣΗ ============ */
async function load(){
  $("siteTitle").textContent=CONFIG.COMMITTEE;
  $("siteSub").textContent=`Πρωταθλήματα ${CONFIG.SEASON}`;
  $("mark").src=COMMITTEE_LOGO;
  let text=SAMPLE_CSV,live=false;
  if(CONFIG.SHEET_CSV_URL){
    try{
      const sep=CONFIG.SHEET_CSV_URL.includes("?")?"&":"?";
      const r=await fetch(CONFIG.SHEET_CSV_URL+sep+"t="+Date.now());
      if(!r.ok) throw new Error(r.status);
      text=await r.text();live=true;
    }catch(e){console.warn("Αποτυχία φόρτωσης φύλλου",e)}
  }
  ALL=toMatches(parseCSV(text));
  const now=new Date();
  $("dataStatus").textContent=live
    ?`Ενημέρωση από το φύλλο αποτελεσμάτων, ${now.getHours()}:${pad2(now.getMinutes())}`
    :(CONFIG.SHEET_CSV_URL?"Το φύλλο δεν φόρτωσε, εμφανίζονται αποθηκευμένα δεδομένα":"Δείγμα δεδομένων");
  renderPublic();
}
load();
